          <p><strong>Cold Locator</strong> is a free, interactive temperature map that finds places colder than where you are right now. Select your location to instantly see cities that are currently colder, or switch to the 7-day forecast mode to track upcoming cold weather and severe storm alerts. Features a NASA HD Satellite view and real-time weather data from <strong>145,000+ cities worldwide</strong>.</p>

            <li><strong>See colder places</strong> — Cities colder than your location appear on the map as color-coded markers</li>
            <li><strong>Explore the map</strong> — Switch to 7-Day Forecast mode for upcoming weather, toggle the NASA HD Satellite view, and zoom in to discover smaller cities</li>

            <dd style="margin-left:16px;">The difference between your location's temperature and a city's temperature. Only negative deltas (colder cities) are displayed.</dd>
